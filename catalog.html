<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог — Магазин «Светлячок»</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="container header-container">
            <a href="index.html" class="logo">
    <img src="images/logo.webp" alt="Светлячок" style="height: 40px; display: block;">
</a>
            
            <nav class="desktop-nav">
                <a href="index.html" class="desktop-nav-link">Главная</a>
                <a href="catalog.html" class="desktop-nav-link">Каталог</a>
                <a href="cart.html" class="desktop-nav-link">Корзина <span class="cart-badge">0</span></a>
                <a href="contacts.html" class="desktop-nav-link">Контакты</a>
            </nav>

            <div class="header-phone">
                 <a href="tel:89528060130" style="color: #ffffff; text-decoration: none; font-size: 14px;">8 (952) 806-01-30</a>
            </div>
        </div>
    </header>

    <main class="main">
        <section class="catalog-section">
            <div class="container">
                <h2 id="catalogTitle" class="catalog-title">Каталог</h2>
                
                <div id="personGrid" class="category-grid" style="display: none;">
                    <a href="catalog.html?person=женское&title=Женское" class="category-tile"><img src="content/images/big_sis.webp" class="tile-img"> Женское</a>
                    <a href="catalog.html?person=мужское&title=Мужское" class="category-tile"><img src="content/images/big_bro.webp" class="tile-img"> Мужское</a>
                    <a href="catalog.html?person=девочки&title=Девочки" class="category-tile"><img src="content/images/blil_sis.webp" class="tile-img"> Девочки</a>
                    <a href="catalog.html?person=мальчики&title=Мальчики" class="category-tile"><img src="content/images/lil_bro.webp" class="tile-img"> Мальчики</a>
                  
                    <a href="catalog.html?type=новинки&title=Новинки" class="category-tile" style="border-color: #ffe6a7;"> Новинки</a>
                    <a href="catalog.html?type=распродажа&title=Распродажа" class="category-tile" style="border-color: #ff7b72; color: #ff9e80;"> Распродажа</a>
                </div>

                <div id="typeGrid" class="category-grid" style="display: none;">
                    <a href="#" id="linkTshirt" class="category-tile"><img src="content/images/tshirt.png" class="tile-img"> Футболки</a>
                    <a href="#" id="linkPants" class="category-tile"><img src="content/images/pants.png" class="tile-img"> Штаны</a>
                    <a href="#" id="linkShorts" class="category-tile"><img src="content/images/shorts.png" class="tile-img"> Шорты</a>
                    <a href="#" id="linkDress" class="category-tile"><img src="content/images/dress.png" class="tile-img"> Платья</a>
                    <a href="#" id="linkShirt" class="category-tile"><img src="content/images/shirt.png" class="tile-img"> Рубашки</a>
                    <a href="#" id="linkOuterwear" class="category-tile"><img src="content/images/outerwear.png" class="tile-img"> Верхняя одежда</a>
                    <a href="#" id="linkShoes" class="category-tile"><img src="content/images/shoes.png" class="tile-img"> Обувь</a>
                    <a href="#" id="linkAccessories" class="category-tile"><img src="content/images/accessories.png" class="tile-img"> Аксессуары</a>
                </div>

                <div id="gallery" class="gallery-grid"></div>
            </div>
        </section>
    </main>

    <nav class="mobile-bottom-bar">
        <a href="index.html" class="mobile-bar-item">
            <img src="images/uploads/home.png" alt="Главная" class="nav-icon">
            <span>Главная</span>
        </a>
        <a href="catalog.html" class="mobile-bar-item">
            <img src="images/uploads/catalog.png" alt="Главная" class="nav-icon">
            <span>Каталог</span>
        </a>
        <a href="cart.html" class="mobile-bar-item cart-bar-item">
            <img src="images/uploads/cart.png" alt="Корзина" class="nav-icon">
            <span>Корзина</span>
            <span id="cartCountMobile" class="cart-badge-mobile">0</span>
        </a>
        <a href="contacts.html" class="mobile-bar-item">
            <img src="images/uploads/pin.png" alt="Контакты" class="nav-icon">
            <span>Контакты</span>
        </a>
    </nav>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Светлячок.</p>
        </div>
    </footer>
  
<div id="productModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 10, 20, 0.85); z-index: 1000; justify-content: center; align-items: center; overflow-y: auto; padding: 20px;">
    <div style="background: #1a1528; border: 1px solid rgba(255, 158, 128, 0.3); border-radius: 16px; max-width: 600px; width: 100%; padding: 30px; position: relative; color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
        <button id="closeModal" style="position: absolute; top: 15px; right: 15px; background: none; border: none; color: #fff; font-size: 24px; cursor: pointer;">&times;</button>
        
        <div id="modalGallery" style="display: flex; gap: 10px; overflow-x: auto; margin-bottom: 20px; padding-bottom: 10px;">

            
        </div>

        <h2 id="modalTitle" style="margin-bottom: 10px; font-size: 24px;"></h2>
        <p id="modalPrice" style="color: #ff9e80; font-size: 22px; font-weight: bold; margin-bottom: 15px;"></p>
        <p id="modalDescription" style="color: #ccc; line-height: 1.6; margin-bottom: 25px;"></p>
        
        <button id="modalAddToCart" style="width: 100%; background: linear-gradient(135deg, #ff9e80, #ff6b6b); color: #fff; border: none; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer;">В корзину</button>
    </div>
</div>

    <script src="script.js"></script>
</body>
</html>
