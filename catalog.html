<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог — Магазин «Светлячок»</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="container header-container">
            <a href="index.html" class="logo">Светлячок</a>
            <nav class="desktop-nav">
                <a href="index.html" class="desktop-nav-link">Главная</a>
                <a href="catalog.html" class="desktop-nav-link">Каталог</a>
                <a href="cart.html" class="desktop-nav-link">Корзина <span id="cartCountDesktop" class="cart-badge">0</span></a>
                <a href="index.html#contacts" class="desktop-nav-link">Контакты</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <section class="catalog-section">
            <div class="container">
                <h2 id="catalogTitle" class="catalog-title">Каталог</h2>
                
                <div id="categoryGrid" class="category-grid" style="display: none;">
                    <a href="catalog.html?type=футболки&title=Футболки" class="category-tile">👕 Футболки</a>
                    <a href="catalog.html?type=штаны&title=Штаны" class="category-tile">👖 Штаны</a>
                    <a href="catalog.html?type=шорты&title=Шорты" class="category-tile">🩳 Шорты</a>
                    <a href="catalog.html?type=платья&title=Платья" class="category-tile">👗 Платья</a>
                    <a href="catalog.html?type=рубашки&title=Рубашки" class="category-tile">👔 Рубашки</a>
                    <a href="catalog.html?type=верхняя одежда&title=Верхняя одежда" class="category-tile">🧥 Верхняя одежда</a>
                    <a href="catalog.html?type=обувь&title=Обувь" class="category-tile">👟 Обувь</a>
                    <a href="catalog.html?type=аксессуары&title=Аксессуары" class="category-tile">🧢 Аксессуары</a>
                </div>

                <div id="gallery" class="gallery-grid"></div>
            </div>
        </section>
    </main>

    <nav class="mobile-bottom-bar">
        <a href="index.html" class="mobile-bar-item">
            <span>🏠</span>
            <span>Главная</span>
        </a>
        <a href="catalog.html" class="mobile-bar-item">
            <span>👕</span>
            <span>Каталог</span>
        </a>
        <a href="cart.html" class="mobile-bar-item cart-bar-item">
            <span>🛒</span>
            <span>Корзина</span>
            <span id="cartCountMobile" class="cart-badge-mobile">0</span>
        </a>
        <a href="index.html#contacts" class="mobile-bar-item">
            <span>📍</span>
            <span>Контакты</span>
        </a>
    </nav>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Светлячок.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
