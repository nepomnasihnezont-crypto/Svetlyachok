<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог — Магазин «Светлячок»</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="container header-container">
            <a href="index.html" class="logo">Светлячок</a>
            <a href="cart.html" class="desktop-cart-link">🛒 Корзина <span id="cartCountDesktop" class="cart-badge">0</span></a>
        </div>
    </header>

    <main class="main">
        <section class="catalog-section">
            <div class="container">
                <h2 id="catalogTitle" class="catalog-title">Каталог</h2>
    
                <div id="categoryGrid" class="category-grid" style="display: none;">
                    <a href="catalog.html?gender=мужское&type=верх&title=Мужское — Верх" class="category-tile">Мужское: Верх</a>
                    <a href="catalog.html?gender=мужское&type=низ&title=Мужское — Низ" class="category-tile">Мужское: Низ</a>
                    <a href="catalog.html?gender=мужское&type=обувь&title=Мужское — Обувь" class="category-tile">Мужское: Обувь</a>
                    
                    <a href="catalog.html?gender=женское&type=верх&title=Женское — Верх" class="category-tile">Женское: Верх</a>
                    <a href="catalog.html?gender=женское&type=низ&title=Женское — Низ" class="category-tile">Женское: Низ</a>
                    <a href="catalog.html?gender=женское&type=обувь&title=Женское — Обувь" class="category-tile">Женское: Обувь</a>
                    
                    <a href="catalog.html?gender=девочка&type=верх&title=Девочка — Верх" class="category-tile">Девочка: Верх</a>
                    <a href="catalog.html?gender=девочка&type=низ&title=Девочка — Низ" class="category-tile">Девочка: Низ</a>
                    <a href="catalog.html?gender=девочка&type=обувь&title=Девочка — Обувь" class="category-tile">Девочка: Обувь</a>
                    
                    <a href="catalog.html?gender=мальчик&type=верх&title=Мальчик — Верх" class="category-tile">Мальчик: Верх</a>
                    <a href="catalog.html?gender=мальчик&type=низ&title=Мальчик — Низ" class="category-tile">Мальчик: Низ</a>
                    <a href="catalog.html?gender=мальчик&type=обувь&title=Мальчик — Обувь" class="category-tile">Мальчик: Обувь</a>
                </div>

                <div id="gallery" class="gallery-grid"></div>
            </div>
        </section>
    </main>

    <nav class="mobile-bottom-bar">
        <a href="index.html" class="mobile-bar-item">
            <span>🏠</span>
            <span>Главная</span>
        </a>
        <a href="catalog.html" class="mobile-bar-item">
            <span>👕</span>
            <span>Каталог</span>
        </a>
        <a href="cart.html" class="mobile-bar-item cart-bar-item">
            <span>🛒</span>
            <span>Корзина</span>
            <span id="cartCountMobile" class="cart-badge-mobile">0</span>
        </a>
        <a href="index.html#contacts" class="mobile-bar-item">
            <span>📍</span>
            <span>Контакты</span>
        </a>
    </nav>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Светлячок.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
