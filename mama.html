<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить товар — Светлячок</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1528; color: #fff; padding: 20px; max-width: 500px; margin: 0 auto; }
        h2 { text-align: center; color: #ffb6c1; }
        .card { background: #2a223f; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #443b63; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #ddd; font-size: 14px; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #443b63; background: #1a1528; color: #fff; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 14px; background: #ff758c; border: none; border-radius: 8px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:active { background: #ff526d; }
        .success { color: #4ade80; text-align: center; margin-top: 10px; font-weight: bold; font-size: 14px; }
        hr { border: none; border-top: 1px solid #443b63; margin: 25px 0; }
    </style>
</head>
<body>

    <h2>Добавление товара</h2>

    <!-- ШАГ 1: ЗАГРУЗКА КАРТИНКИ -->
    <div class="card">
        <h3 style="color: #ff9e80; margin-bottom: 15px; font-size: 18px;">Шаг 1: Загрузить фото</h3>
        <div class="form-group">
            <label>Выберите фото с телефона:</label>
            <input type="file" id="imageFile" accept="image/*">
        </div>
        <div class="form-group">
            <label>Придумайте имя для файла (на английском, без пробелов):</label>
            <input type="text" id="imgName" placeholder="например: платье1">
        </div>
        <button onclick="saveImage()" style="background: #4a3b6c;">Сохранить картинку</button>
        <div id="imgStatus" class="success"></div>
    </div>

    <!-- ШАГ 2: ДОБАВЛЕНИЕ ТОВАРА -->
    <div class="card">
        <h3 style="color: #ff9e80; margin-bottom: 15px; font-size: 18px;">Шаг 2: Создать товар</h3>
        
        <div class="form-group">
            <label>Название товара:</label>
            <input type="text" id="title" placeholder="Платье летнее">
        </div>

        <div class="form-group">
            <label>Цена (руб):</label>
            <input type="number" id="price" placeholder="1500">
        </div>

        <div class="form-group">
            <label>Категория (пол):</label>
            <select id="gender">
                <option value="женское">Женское</option>
                <option value="мужское">Мужское</option>
                <option value="девочки">Девочки</option>
                <option value="мальчики">Мальчики</option>
                <option value="новинки">Новинки</option>
                <option value="распродажа">Распродажа</option>
            </select>
        </div>

        <div class="form-group">
            <label>Тип одежды:</label>
            <select id="type">
                <option value="футболки">Футболки</option>
                <option value="штаны">Штаны</option>
                <option value="шорты">Шорты</option>
                <option value="платья">Платья</option>
                <option value="рубашки">Рубашки</option>
                <option value="верхняя одежда">Верхняя одежда</option>
                <option value="обувь">Обувь</option>
                <option value="аксессуары">Аксессуары</option>
            </select>
        </div>

        <div class="form-group">
            <label>Путь к картинке (подставится сам из Шага 1 или напиши вручную):</label>
            <input type="text" id="imagePath" placeholder="images/uploads/платье1.jpg">
        </div>

        <button onclick="downloadJson()">Сформировать и скачать товар</button>
        <div id="finalStatus" class="success"></div>
    </div>

    <script>
        // Шаг 1: Сохраняем картинку так, чтобы телефон скачал её в правильную папку
        function saveImage() {
            const fileInput = document.getElementById('imageFile');
            const nameInput = document.getElementById('imgName').value.trim();
            const imgStatus = document.getElementById('imgStatus');

            if (fileInput.files.length === 0 || !nameInput) {
                alert('Выбери фото и напиши его имя!');
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                // Автоматически скачиваем картинку на телефон, чтобы мама закинула её в GitHub (в папку images/uploads/)
                const a = document.createElement('a');
                a.href = e.target.result;
                a.download = nameInput + '.jpg';
                document.body.appendChild(a);
                a.click();
                a.remove();

                // Автоматически подставляем путь во вторую форму
                const fullPath = 'images/uploads/' + nameInput + '.jpg';
                document.getElementById('imagePath').value = fullPath;

                imgStatus.innerText = 'Готово! Картинка скачана на телефон. Закинь её на GitHub в папку images/uploads/';
            };

            reader.readAsDataURL(file);
        }

        // Шаг 2: Формируем JSON файл с товаром
        function downloadJson() {
            const title = document.getElementById('title').value;
            const price = Number(document.getElementById('price').value);
            const gender = document.getElementById('gender').value;
            const type = document.getElementById('type').value;
            const image = document.getElementById('imagePath').value;
            const finalStatus = document.getElementById('finalStatus');

            if (!title || !price || !image) {
                alert('Заполни все поля в Шаге 2!');
                return;
            }

            const newProduct = { title, price, gender, type, image };
            const dataToSave = { products: [newProduct] };

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dataToSave, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "index.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();

            finalStatus.innerText = 'Файл index.json скачан! Закинь его на GitHub в папку content/products/';
        }
    </script>
</body>
</html>
