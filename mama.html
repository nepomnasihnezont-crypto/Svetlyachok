<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить товар — Светлячок</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1528; color: #fff; padding: 20px; max-width: 500px; margin: 0 auto; }
        h2 { text-align: center; color: #ffb6c1; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #ddd; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #443b63; background: #2a223f; color: #fff; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 14px; background: #ff758c; border: none; border-radius: 8px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:active { background: #ff526d; }
        .success { color: #4ade80; text-align: center; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Добавление товара для мамы</h2>
    
    <div class="form-group">
        <label>Название товара:</label>
        <input type="text" id="title" placeholder="Например: Платье летнее">
    </div>

    <div class="form-group">
        <label>Цена (руб):</label>
        <input type="number" id="price" placeholder="1500">
    </div>

    <div class="form-group">
        <label>Пол (категория):</label>
        <select id="gender">
            <option value="женское">Женское</option>
            <option value="мужское">Мужское</option>
            <option value="девочки">Девочки</option>
            <option value="мальчики">Мальчики</option>
            <option value="новинки">Новинки</option>
            <option value="распродажа">Распродажа</option>
        </select>
    </div>

    <div class="form-group">
        <label>Тип одежды:</label>
        <select id="type">
            <option value="футболки">Футболки</option>
            <option value="штаны">Штаны</option>
            <option value="шорты">Шорты</option>
            <option value="платья">Платья</option>
            <option value="рубашки">Рубашки</option>
            <option value="верхняя одежда">Верхняя одежда</option>
            <option value="обувь">Обувь</option>
            <option value="аксессуары">Аксессуары</option>
        </select>
    </div>

    <div class="form-group">
        <label>Ссылка на картинку (или имя файла):</label>
        <input type="text" id="image" placeholder="images/uploads/dress.jpg">
    </div>

    <button onclick="downloadJson()">Скачать обновленный файл товаров</button>
    <div id="status" class="success"></div>

    <script>
        function downloadJson() {
            const title = document.getElementById('title').value;
            const price = Number(document.getElementById('price').value);
            const gender = document.getElementById('gender').value;
            const type = document.getElementById('type').value;
            const image = document.getElementById('image').value;

            if (!title || !price || !image) {
                alert('Заполни все поля!');
                return;
            }

            // Создаем структуру, которую ждет твой catalog.html
            const newProduct = { title, price, gender, type, image };

            // Здесь можно вставить старые товары, если нужно, или собрать итоговый файл
            const dataToSave = {
                products: [
                    newProduct
                    // Сюда можно добавить остальные товары в формате JSON
                ]
            };

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dataToSave, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "index.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();

            document.getElementById('status').innerText = 'Файл index.json скачан! Закинь его на GitHub.';
        }
    </script>
</body>
</html>
