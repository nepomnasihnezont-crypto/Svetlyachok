backend:
  name: git-gateway
  branch: main

media_folder: "content/images"
public_folder: "/content/images"

collections:
  - name: "products"
    label: "Товары"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Название товара", name: "title", widget: "string"}
      - label: "Пол / аудитория"
        name: "gender"
        widget: "select"
        options: ["женское", "мужское", "девочки", "мальчики"]
      - label: "Категория"
        name: "type"
        widget: "select"
        options: ["футболки", "штаны", "шорты", "платья", "рубашки", "верхняя одежда", "обувь", "аксессуары"]
      - label: "Статус товара"
        name: "status"
        widget: "select"
        options: ["в наличии", "под заказ", "нет в наличии"]
      - {label: "Цена (только цифры)", name: "price", widget: "number", value_type: "int"}
      - {label: "Фотография товара", name: "image", widget: "image"}
