backend:
  name: github
  repo: nepomnasihnezont-crypto/Светлячок  # Проверь, чтобы название твоего репозитория было точным
  branch: main

media_folder: "images/uploads"
public_folder: "images/uploads"

collections:
  - name: "products_file"
    label: "Каталог товаров"
    files:
      - name: "products"
        label: "Товары"
        file: "content/products/index.json"
        fields:
          - label: "Товары"
            name: "products"
            widget: "list"
            fields:
              - {label: "Название", name: "title", widget: "string"}
              - {label: "Цена", name: "price", widget: "number"}
              - {label: "Пол", name: "gender", widget: "string"}
              - {label: "Тип", name: "type", widget: "string"}
              - {label: "Картинка", name: "image", widget: "image"}
