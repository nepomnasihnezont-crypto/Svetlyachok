<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина — Магазин «Светлячок»</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="container header-container">
            <a href="index.html" class="logo">Светлячок</a>
            
            <a href="cart.html" class="desktop-cart-link">🛒 Корзина <span id="cartCountDesktop" class="cart-badge">0</span></a>
        </div>
    </header>

    <main class="main">
        <section class="cart-section">
            <div class="container">
                <h2 class="catalog-title">Ваша корзина</h2>
                <div id="cartItemsContainer"></div>
                <div id="cartSummary" class="cart-summary" style="display: none;">
                    <p class="cart-total-text">Итого: <span id="cartTotalPrice">0</span> ₽</p>
                    <button id="checkoutBtn" class="group-btn">Оформить заказ</button>
                </div>
            </div>
        </section>
    </main>

    <nav class="mobile-bottom-bar">
        <a href="index.html" class="mobile-bar-item">
            <span>🏠</span>
            <span>Главная</span>
        </a>
        <a href="catalog.html?gender=женское&type=верх&title=Каталог" class="mobile-bar-item">
            <span>👕</span>
            <span>Каталог</span>
        </a>
        <a href="cart.html" class="mobile-bar-item cart-bar-item">
            <span>🛒</span>
            <span>Корзина</span>
            <span id="cartCountMobile" class="cart-badge-mobile">0</span>
        </a>
        <a href="index.html#contacts" class="mobile-bar-item">
            <span>📍</span>
            <span>Контакты</span>
        </a>
    </nav>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Светлячок.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
