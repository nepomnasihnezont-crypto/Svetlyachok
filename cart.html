<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина — Магазин «Светлячок»</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="container header-container">
            <a href="index.html" class="logo">Светлячок</a>
            <nav class="desktop-nav">
                <a href="index.html" class="desktop-nav-link">Главная</a>
                <a href="catalog.html" class="desktop-nav-link">Каталог</a>
                <a href="cart.html" class="desktop-nav-link">Корзина <span id="cartCountDesktop" class="cart-badge">0</span></a>
                <a href="contacts.html" class="desktop-nav-link">Контакты</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <section class="cart-section">
            <div class="container">
                <h2 class="catalog-title">Ваша корзина</h2>
                <div id="cartItemsContainer"></div>
                <div id="cartSummary" class="cart-summary" style="display: none;">
                    <p class="cart-total-text">Итого: <span id="cartTotalPrice">0</span> ₽</p>
                    <button id="checkoutBtn" class="group-btn">Оформить заказ</button>
                </div>
            </div>
        </section>
    </main>

    <nav class="mobile-bottom-bar">
        <a href="index.html" class="mobile-bar-item">
            <img src="images/uploads/home.png" alt="Главная" class="nav-icon">
            <span>Главная</span>
        </a>
        <a href="catalog.html" class="mobile-bar-item">
            <img src="images/uploads/catalog.png" alt="Главная" class="nav-icon">
            <span>Каталог</span>
        </a>
        <a href="cart.html" class="mobile-bar-item cart-bar-item">
            <img src="images/uploads/cart.png" alt="Корзина" class="nav-icon">
            <span>Корзина</span>
            <span id="cartCountMobile" class="cart-badge-mobile">0</span>
        </a>
        <a href="contacts.html" class="mobile-bar-item">
            <img src="images/uploads/pin.png" alt="Контакты" class="nav-icon">
            <span>Контакты</span>
        </a>
    </nav>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Светлячок.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
