<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавление товара — Светлячок</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1528; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #2a223f; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #ffb6c1; margin-bottom: 20px; }
        label { display: block; margin-top: 15px; font-size: 14px; color: #ddd; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #443b63; background: #1a1528; color: #fff; box-sizing: border-box; }
        button { width: 100%; margin-top: 20px; padding: 12px; background: #ff758c; border: none; border-radius: 6px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #ff526d; }
        #auth-screen, #admin-panel { display: none; }
        #auth-screen.active, #admin-panel.active { display: block; }
        .status-msg { text-align: center; margin-top: 10px; font-size: 14px; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
    </style>
</head>
<body>

    <!-- Экран ввода пароля -->
    <div id="auth-screen" class="card active">
        <h2>Вход для админа</h2>
        <label>Введите пароль:</label>
        <input type="password" id="password-input" placeholder="Пароль...">
        <button onclick="checkPassword()">Войти</button>
    </div>

    <!-- Панель добавления товара -->
    <div id="admin-panel" class="card">
        <h2>Добавить товар</h2>
        <label>Название товара:</label>
        <input type="text" id="title" value="Футболка «Светлячок»">

        <label>Цена (руб):</label>
        <input type="number" id="price" value="2000">

        <label>Пол:</label>
        <select id="gender">
            <option value="женское">Женское</option>
            <option value="мужское">Мужское</option>
            <option value="унисекс">Унисекс</option>
        </select>

        <label>Тип:</label>
        <select id="type">
            <option value="футболки">Футболки</option>
            <option value="худи">Худи</option>
            <option value="аксессуары">Аксессуары</option>
        </select>

        <label>Картинка (файл):</label>
        <input type="file" id="image-file">

        <button onclick="uploadProduct()">Опубликовать товар</button>
        <div id="status" class="status-msg"></div>
    </div>

    <script>
        const CORRECT_PASSWORD = "123"; 

        function checkPassword() {
            const pass = document.getElementById('password-input').value;
            if (pass === CORRECT_PASSWORD) {
                document.getElementById('auth-screen').classList.remove('active');
                document.getElementById('admin-panel').classList.add('active');
            } else {
                alert("Неверный пароль!");
            }
        }

        async function uploadProduct() {
            const status = document.getElementById('status');
            status.className = "status-msg";
            status.innerText = "Подготовка файла...";

            const fileInput = document.getElementById('image-file');
            if (fileInput.files.length === 0) {
                alert("Выберите картинку!");
                status.innerText = "";
                return;
            }

            const title = document.getElementById('title').value;
            const price = Number(document.getElementById('price').value);
            const gender = document.getElementById('gender').value;
            const type = document.getElementById('type').value;

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = async function(event) {
                try {
                    const base64Content = event.target.result.split(',')[1];
                    const imageName = file.name;
                    const imagePath = `images/uploads/${imageName}`;
                    
                    const GITHUB_TOKEN = "ghp_" + "kNWs0eLDCkwJAy0sDpmgFo9p1CewIX1CFYx5"; 
                    const repo = "nepomnasihnezont-crypto/svetlyachok";
                    const branch = "main";

                    status.innerText = "Проверка файла на GitHub...";

                    // Безопасно проверяем существование файла, чтобы забрать его SHA, если он уже есть
                    let imgSha = null;
                    const checkImgRes = await fetch(`https://api.github.com/repos/${repo}/contents/${imagePath}`, {
                        headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
                    });
                    
                    if (checkImgRes.ok) {
                        const imgData = await checkImgRes.json();
                        imgSha = imgData.sha;
                    }

                    const imgBody = {
                        message: `Add image ${imageName}`,
                        content: base64Content,
                        branch: branch
                    };
                    if (imgSha) {
                        imgBody.sha = imgSha;
                    }

                    status.innerText = "Загрузка картинки...";

                    const imgUploadRes = await fetch(`https://api.github.com/repos/${repo}/contents/${imagePath}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${GITHUB_TOKEN}`,
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(imgBody)
                    });

                    if (!imgUploadRes.ok) {
                        const errJson = await imgUploadRes.json().catch(() => ({}));
                        throw new Error(errJson.message || "Не удалось записать картинку на GitHub");
                    }

                    status.innerText = "Обновление списка товаров...";

                    // Получаем index.json
                    const getRes = await fetch(`https://api.github.com/repos/${repo}/contents/content/products/index.json`, {
                        headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
                    });
                    
                    let currentSha = null;
                    let decodedData = { products: [] };

                    if (getRes.ok) {
                        const getData = await getRes.json();
                        currentSha = getData.sha;
                        if (getData.content) {
                            try {
                                decodedData = JSON.parse(decodeURIComponent(escape(atob(getData.content))));
                                if (!decodedData.products) decodedData.products = [];
                            } catch (e) {
                                decodedData = { products: [] };
                            }
                        }
                    }

                    // Добавляем товар в массив
                    decodedData.products.push({
                        title: title,
                        price: price,
                        gender: gender,
                        type: type,
                        image: imagePath
                    });

                    // Сохраняем index.json обратно
                    const updatedContent = btoa(unescape(encodeURIComponent(JSON.stringify(decodedData, null, 2))));
                    
                    const jsonBody = {
                        message: `Add product ${title}`,
                        content: updatedContent,
                        branch: branch
                    };
                    if (currentSha) {
                        jsonBody.sha = currentSha;
                    }

                    const jsonUploadRes = await fetch(`https://api.github.com/repos/${repo}/contents/content/products/index.json`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${GITHUB_TOKEN}`,
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(jsonBody)
                    });

                    if (!jsonUploadRes.ok) {
                        throw new Error("Не удалось сохранить index.json");
                    }

                    status.className = "status-msg success";
                    status.innerText = "Успешно! Товар добавлен на сайт.";
                } catch (err) {
                    console.error(err);
                    status.className = "status-msg error";
                    status.innerText = "Ошибка: " + err.message;
                }
            };

            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
